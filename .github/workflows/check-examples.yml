name: Check companion examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 05-aws-consent/infra/package-lock.json
      - run: dotnet run --project 01-local-consent/tests/Consent.Checks
      - run: dotnet run --project 06-testing-and-review/Cloud.Checks
      - run: node tools/check-mcp.mjs
      - run: dotnet publish 05-aws-consent/function/Consent.Cloud.csproj -c Release -o 05-aws-consent/function/publish --no-self-contained
      - run: npm ci --ignore-scripts
        working-directory: 05-aws-consent/infra
      - run: npm run synth -- --quiet
        working-directory: 05-aws-consent/infra
      - run: node check-template.mjs
        working-directory: 05-aws-consent/infra
      - run: node tools/check-repo.mjs
